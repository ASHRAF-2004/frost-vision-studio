name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libusb-1.0-0 libxcb-cursor0 libxkbcommon-x11-0 fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify tag matches application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python -c "from frostvision import __version__; import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
          fi
      - run: python -m pytest -q
      - run: python aio_screen_manager.py --smoke-test
      - run: python scripts/soak.py --seconds 20 --output verification-local/ci-soak.json
      - run: python scripts/build.py
      - name: Frozen Linux smoke test
        if: runner.os == 'Linux'
        run: dist/FrostVisionStudio/FrostVisionStudio --smoke-test
      - name: Frozen Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath .\dist\FrostVisionStudio\FrostVisionStudio.exe -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($appProcess.ExitCode -ne 0) { throw "Frozen smoke test failed: $($appProcess.ExitCode)" }
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup --yes --no-progress; }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*setup.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain LGPL component sources
        run: |
          python scripts/fetch_sources.py
          cp dist/*third-party-sources.tar.gz release-assets/
      - name: Checksums
        run: cd release-assets && sha256sum *.exe *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Frost Vision Studio ${GITHUB_REF_NAME} — Windows & Linux preview" --notes-file docs/RELEASE_NOTES.md
