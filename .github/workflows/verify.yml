name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libusb-1.0-0 libxcb-cursor0 libxkbcommon-x11-0 fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python aio_screen_manager.py --smoke-test
      - run: python scripts/soak.py --seconds 20 --output verification-local/ci-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: verification-local/
